services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netsentinel}
      POSTGRES_USER: ${POSTGRES_USER:-netsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-development-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-netsentinel}:${POSTGRES_PASSWORD:-change-this-local-development-password}@postgres:5432/${POSTGRES_DB:-netsentinel}
      NETSENTINEL_AGENT_ENROLLMENT_KEY: ${NETSENTINEL_AGENT_ENROLLMENT_KEY:-${NETSENTINEL_API_KEY:-replace-with-a-long-random-enrollment-secret}}
      NETSENTINEL_AGENT_ONLINE_TIMEOUT_SECONDS: ${NETSENTINEL_AGENT_ONLINE_TIMEOUT_SECONDS:-90}
      NETSENTINEL_AUTH_SECRET: ${NETSENTINEL_AUTH_SECRET:-replace-with-a-different-long-random-secret}
      NETSENTINEL_AUTH_SESSION_MINUTES: ${NETSENTINEL_AUTH_SESSION_MINUTES:-480}
      NETSENTINEL_AUTH_COOKIE_SECURE: ${NETSENTINEL_AUTH_COOKIE_SECURE:-false}
      NETSENTINEL_ADMIN_USERNAME: ${NETSENTINEL_ADMIN_USERNAME:-admin}
      NETSENTINEL_ADMIN_PASSWORD: ${NETSENTINEL_ADMIN_PASSWORD:-change-this-development-admin-password}
      NETSENTINEL_HOST_ACTIVE_TIMEOUT_SECONDS: ${NETSENTINEL_HOST_ACTIVE_TIMEOUT_SECONDS:-300}
      NETSENTINEL_DETECTION_ENABLED: ${NETSENTINEL_DETECTION_ENABLED:-true}
      NETSENTINEL_CONNECTION_SPIKE_BASELINE_SECONDS: ${NETSENTINEL_CONNECTION_SPIKE_BASELINE_SECONDS:-600}
      NETSENTINEL_CONNECTION_SPIKE_MULTIPLIER: ${NETSENTINEL_CONNECTION_SPIKE_MULTIPLIER:-3}
      NETSENTINEL_UNUSUAL_DESTINATION_PORTS: ${NETSENTINEL_UNUSUAL_DESTINATION_PORTS:-[23,445,1433,3389,5900]}
      NETSENTINEL_DETECTION_ALERT_COOLDOWN_SECONDS: ${NETSENTINEL_DETECTION_ALERT_COOLDOWN_SECONDS:-300}
      NETSENTINEL_DNS_QUERY_RATE_WINDOW_SECONDS: ${NETSENTINEL_DNS_QUERY_RATE_WINDOW_SECONDS:-60}
      NETSENTINEL_DNS_QUERY_RATE_THRESHOLD: ${NETSENTINEL_DNS_QUERY_RATE_THRESHOLD:-100}
      NETSENTINEL_DNS_LONG_DOMAIN_LENGTH: ${NETSENTINEL_DNS_LONG_DOMAIN_LENGTH:-80}
      NETSENTINEL_DNS_FAILURE_WINDOW_SECONDS: ${NETSENTINEL_DNS_FAILURE_WINDOW_SECONDS:-300}
      NETSENTINEL_DNS_FAILURE_THRESHOLD: ${NETSENTINEL_DNS_FAILURE_THRESHOLD:-10}
      NETSENTINEL_DISCORD_WEBHOOK_URL: ${NETSENTINEL_DISCORD_WEBHOOK_URL:-}
      NETSENTINEL_NOTIFICATION_RATE_LIMIT_SECONDS: ${NETSENTINEL_NOTIFICATION_RATE_LIMIT_SECONDS:-300}
      NETSENTINEL_NOTIFICATION_TIMEOUT_SECONDS: ${NETSENTINEL_NOTIFICATION_TIMEOUT_SECONDS:-5}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: dashboard
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/live}
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/live}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
